# Atelier under /gpu/ (node 127.0.0.1:18790, BASE_PATH=/gpu, path preserved). Installed on 13 as
# /etc/nginx/snippets/atelier.conf and included from both the fileshare site and conf.d/00-webdeploy.conf.
# Older URLs keep working: /atelier/… and /studio/… → 301 /gpu/…  The raw ComfyUI gateway (token cookie /
# bearer, maps in conf.d/10-gpu.conf) moved from /gpu/ to /comfy/ ; :8443 still serves it as before.
location = /gpu { return 301 /gpu/; }
location ^~ /gpu/ {
    proxy_pass http://127.0.0.1:18790;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 0;
}
# legacy names
location = /atelier { return 301 /gpu/; }
location ^~ /atelier/ { rewrite ^/atelier/(.*)$ /gpu/$1 permanent; }
location = /studio { return 301 /gpu/; }
location ^~ /studio/ { rewrite ^/studio/(.*)$ /gpu/$1 permanent; }
# raw ComfyUI gateway (prefix stripped)
location = /comfy { return 301 /comfy/; }
location = /comfy/login {
    if ($arg_token = "__GPU_TOKEN__") {
        add_header Set-Cookie "gputoken=__GPU_TOKEN__; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=7776000";
        return 302 /comfy/;
    }
    return 401 "bad token\n";
}
location ^~ /comfy/ {
    if ($gpu_ok = 0) { return 401; }
    proxy_pass http://127.0.0.1:19188/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 0;
}
